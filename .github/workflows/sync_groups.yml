name: Sync main to group branches (PR)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  sync-pr:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target_branch: [grupo-a, grupo-b]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open sync PR from main to ${{ matrix.target_branch }}
        env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN }}
        run: |
          git fetch origin main ${{ matrix.target_branch }}

          AHEAD=$(git rev-list --count origin/${{ matrix.target_branch }}..origin/main)
          if [ "$AHEAD" -eq 0 ]; then
            echo "${{ matrix.target_branch }} já está sincronizado com a main."
            exit 0
          fi

          EXISTING_PR=$(gh pr list --base "${{ matrix.target_branch }}" --head main --state open --json number --jq 'length')
          if [ "$EXISTING_PR" -gt 0 ]; then
            echo "Já existe um PR de sync aberto para ${{ matrix.target_branch }}."
            exit 0
          fi

          gh pr create \
            --base "${{ matrix.target_branch }}" \
            --head main \
            --title "chore(sync): main -> ${{ matrix.target_branch }}" \
            --body "Sincronização automática da \`main\` para \`${{ matrix.target_branch }}\`."