name: CI

# Corre o lint e o build em cada PR para main, grupo-a e grupo-b (e em pushes para esses branches).
on:
  pull_request:
    branches: [main, grupo-a, grupo-b, Grupo-A, Grupo-B]
  push:
    branches: [main, grupo-a, grupo-b, Grupo-A, Grupo-B]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
